  <circle cx="234" cy="246" r="6" fill="#4ADE80"/><rect x="248" y="241" width="84" height="9" rx="5" fill="#AAB7D4" opacity=".6"/>
  <circle cx="234" cy="270" r="6" fill="#4ADE80"/><rect x="248" y="265" width="68" height="9" rx="5" fill="#AAB7D4" opacity=".6"/>
</g>
</svg>
