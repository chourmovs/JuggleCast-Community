<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">JuggleCast — Self-hosted radio automation</title>
<desc id="desc">JuggleCast social preview with radio signal and product positioning.</desc>
<defs>

<linearGradient id="fc-gradient" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#67E8F9"/>
  <stop offset="48%" stop-color="#22D3EE"/>
  <stop offset="100%" stop-color="#8B5CF6"/>
</linearGradient>


<filter id="fc-glow" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="4" result="blur"/>
  <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>

<radialGradient id="bg-a" cx="82%" cy="12%" r="70%">
  <stop offset="0%" stop-color="#251B55"/>
  <stop offset="55%" stop-color="#090E21"/>
  <stop offset="100%" stop-color="#050816"/>
</radialGradient>
<linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
  <stop stop-color="#151F42" stop-opacity=".95"/>
  <stop offset="1" stop-color="#0A1025" stop-opacity=".95"/>
</linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
  <path d="M40 0H0V40" fill="none" stroke="#8BA0CF" stroke-opacity=".08" stroke-width="1"/>
</pattern>
</defs>
<rect width="1200" height="630" fill="url(#bg-a)"/>
<rect width="1200" height="630" fill="url(#grid)"/>
<circle cx="1040" cy="90" r="260" fill="#8B5CF6" opacity=".08"/>
<circle cx="930" cy="560" r="300" fill="#22D3EE" opacity=".05"/>

<g transform="translate(72 70)">
  <rect x="0" y="0" width="126" height="126" rx="32" fill="#0E1630" stroke="#334568" stroke-width="4"/>
  <circle cx="63" cy="63" r="10" fill="#22D3EE" filter="url(#fc-glow)"/>
  <path d="M45 45c-10 10-10 26 0 36M81 45c10 10 10 26 0 36M33 33c-17 17-17 43 0 60M93 33c17 17 17 43 0 60" fill="none" stroke="url(#fc-gradient)" stroke-width="6" stroke-linecap="round"/>
</g>

<text x="232" y="160" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="76" font-weight="800" letter-spacing="-3" fill="#F4F7FF">JuggleCast</text>
<text x="75" y="282" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="58" font-weight="800" letter-spacing="-2" fill="#F4F7FF">
  <tspan x="75" dy="0">Automate your radio.</tspan>
  <tspan x="75" dy="72" fill="url(#fc-gradient)">Own the broadcast path.</tspan>
</text>
<text x="80" y="445" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="500" fill="#AAB7D4">
  Scheduling · Transitions · Rust playout · Icecast delivery
</text>
<g transform="translate(78 500)">
  <rect width="530" height="58" rx="16" fill="url(#panel)" stroke="#334568"/>
  <text x="24" y="38" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="22" fill="#67E8F9">Self-hosted · Docker Compose · Linux</text>
</g>

