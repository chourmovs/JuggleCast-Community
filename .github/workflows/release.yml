name: Community prerelease

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Create the public GitHub prerelease
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Load JuggleCast version
        shell: bash
        run: |
          set -euo pipefail

          [[ -f version.env ]] || {
            echo "::error::version.env is missing"
            exit 1
          }

          assignment_count="$(
            grep -c '^FLOWCAST_VERSION=' version.env || true
          )"

          [[ "$assignment_count" -eq 1 ]] || {
            echo "::error::version.env must contain exactly one FLOWCAST_VERSION assignment"
            exit 1
          }

          version="$(
            sed -n \
              's/^FLOWCAST_VERSION=//p' \
              version.env
          )"

          [[ -n "$version" ]] || {
            echo "::error::FLOWCAST_VERSION is empty"
            exit 1
          }

          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]] || {
            echo "::error::Version must match X.Y.Z-rc.N"
            exit 1
          }

          echo "FLOWCAST_VERSION=$version" >> "$GITHUB_ENV"
          echo "Resolved JuggleCast version: $version"

      - name: Validate release request
        shell: bash
        run: |
          set -euo pipefail

          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "::error::Releases must run from main"
            exit 1
          }

          if git rev-parse \
            "v$FLOWCAST_VERSION" \
            >/dev/null 2>&1
          then
            echo "::error::Tag v$FLOWCAST_VERSION already exists"
            exit 1
          fi

      - name: Audit and test public repository
        env:
          FLOWCAST_DOCKER_GID: "0"
        shell: bash
        run: |
          set -euo pipefail

          bash -n install.sh

          python3 scripts/audit-public-repository.py
          python3 scripts/audit-runtime-contract.py
          python3 scripts/docs/validate_docs.py
          python3 -m unittest discover -s tests -v

          shellcheck \
            --severity=error \
            install.sh \
            scripts/community/*.sh \
            scripts/lib/*.sh

          docker compose \
            --env-file .env.example \
            --env-file version.env \
            -f compose.yml \
            config \
            --quiet

          docker compose \
            --env-file .env.example \
            --env-file version.env \
            -f compose.yml \
            -f compose.docker-control.yml \
            config \
            --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Inspect public linux/amd64 images anonymously
        shell: bash
        run: |
          set -euo pipefail

          docker logout ghcr.io >/dev/null 2>&1 || true
          mkdir -p dist

          scripts/release/inspect-images.sh \
            "$FLOWCAST_VERSION" \
            > dist/images.lock

      - name: Build deterministic archive and manifest
        shell: bash
        run: |
          set -euo pipefail

          scripts/release/build-release.sh \
            "$FLOWCAST_VERSION"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: dist/stage
          output-file: dist/sbom.spdx.json
          upload-artifact: false

      - name: Upload qualification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jugglecast-community-v${{ env.FLOWCAST_VERSION }}
          if-no-files-found: error
          path: |
            dist/jugglecast-community-v${{ env.FLOWCAST_VERSION }}.tar.gz
            dist/flowcast-community-v${{ env.FLOWCAST_VERSION }}.tar.gz
            dist/checksums.sha256
            dist/images.lock
            dist/release-manifest.json
            dist/sbom.spdx.json

      - name: Publish public prerelease
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create \
            "v$FLOWCAST_VERSION" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "JuggleCast Community v$FLOWCAST_VERSION" \
            --notes "Preview for linux/amd64 only; not production-grade." \
            "dist/jugglecast-community-v$FLOWCAST_VERSION.tar.gz" \
            "dist/flowcast-community-v$FLOWCAST_VERSION.tar.gz" \
            dist/checksums.sha256 \
            dist/images.lock \
            dist/release-manifest.json \
            dist/sbom.spdx.json
