name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-package:
    name: Validate Community package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Load JuggleCast version
        shell: bash
        run: |
          set -euo pipefail

          test -f version.env || {
            echo "::error::version.env is missing"
            exit 1
          }

          assignment_count="$(
            grep -c '^FLOWCAST_VERSION=' version.env || true
          )"

          [[ "$assignment_count" -eq 1 ]] || {
            echo "::error::version.env must contain exactly one FLOWCAST_VERSION assignment"
            exit 1
          }

          version="$(
            sed -n \
              's/^FLOWCAST_VERSION=//p' \
              version.env
          )"

          [[ -n "$version" ]] || {
            echo "::error::FLOWCAST_VERSION is empty"
            exit 1
          }

          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]] || {
            echo "::error::Invalid FLOWCAST_VERSION: $version"
            exit 1
          }

          [[ "$version" != "latest" ]] || {
            echo "::error::FLOWCAST_VERSION cannot use the mutable latest tag"
            exit 1
          }

          echo "FLOWCAST_VERSION=$version" >> "$GITHUB_ENV"
          echo "Resolved JuggleCast version: $version"

      - name: Check installer syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n install.sh

      - name: Check remote installer argument path
        shell: bash
        run: |
          set -euo pipefail

          temp_directory="$(mktemp -d)"
          trap 'rm -rf "$temp_directory"' EXIT

          cp install.sh "$temp_directory/install.sh"

          (
            cd "$temp_directory"

            bash ./install.sh \
              --version "$FLOWCAST_VERSION" \
              --dry-run \
              --no-docker-control \
              --install-dir "$temp_directory/flowcast"
          )

      - name: Audit public repository
        run: |
          python3 scripts/audit-public-repository.py

      - name: Audit runtime contract
        run: |
          python3 scripts/audit-runtime-contract.py

      - name: Validate documentation
        run: |
          python3 scripts/docs/validate_docs.py

      - name: Run Python unit tests
        run: |
          python3 -m unittest discover \
            -s tests \
            -v

      - name: Run ShellCheck
        run: |
          shellcheck \
            --severity=error \
            install.sh \
            scripts/community/*.sh \
            scripts/lib/*.sh

      - name: Validate YAML syntax
        shell: bash
        run: |
          set -euo pipefail

          ruby <<'RUBY'
          require "yaml"

          files = Dir[
            "**/*.{yml,yaml}",
            ".github/**/*.{yml,yaml}"
          ].uniq.sort

          files.each do |file|
            YAML.parse_file(file)
            puts "Valid YAML: #{file}"
          end
          RUBY

      - name: Check essential external links
        shell: bash
        run: |
          set -euo pipefail

          urls=(
            "https://github.com/chourmovs/JuggleCast-Community/releases"
            "https://github.com/chourmovs/JuggleCast-Community/security"
          )

          for url in "${urls[@]}"; do
            echo "Checking ${url}"

            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 3 \
              --retry-all-errors \
              --connect-timeout 10 \
              --max-time 30 \
              --output /dev/null \
              "$url"
          done

      - name: Render base Compose configuration
        run: |
          docker compose \
            --env-file .env.example \
            --env-file version.env \
            -f compose.yml \
            config \
            --quiet

      - name: Render Docker Control configuration
        env:
          FLOWCAST_DOCKER_GID: "0"
        run: |
          docker compose \
            --env-file .env.example \
            --env-file version.env \
            -f compose.yml \
            -f compose.docker-control.yml \
            config \
            --quiet

      - name: Verify immutable image references
        shell: bash
        run: |
          set -euo pipefail

          if grep -R \
            --include='compose*.yml' \
            -nE '^[[:space:]]*build[[:space:]]*:' \
            .; then
            echo "::error::Public Compose files must not contain build directives."
            exit 1
          fi

          if grep -R \
            --include='compose*.yml' \
            -nE 'image:.*:latest([[:space:]]|$)' \
            .; then
            echo "::error::Compose images must not use the mutable latest tag."
            exit 1
          fi

      - name: Verify version source uniqueness
        shell: bash
        run: |
          set -euo pipefail

          forbidden_files=(
            "VERSION"
            "versions.env"
          )

          for file in "${forbidden_files[@]}"; do
            if [[ -e "$file" ]]; then
              echo "::error::$file must not exist. version.env is the single version source."
              exit 1
            fi
          done

          if grep -n \
            '^FLOWCAST_VERSION=' \
            .env.example
          then
            echo "::error::.env.example must not define FLOWCAST_VERSION."
            exit 1
          fi

          echo "Version source uniqueness passed."

  website:
    name: Validate Astro website
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: website

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Refresh package lock graph
        run: |
          npm install \
            --package-lock-only \
            --ignore-scripts \
            --no-audit \
            --no-fund

      - name: Install website dependencies
        run: |
          npm ci \
            --no-audit \
            --no-fund

      - name: Check Astro project
        run: |
          npm run check

      - name: Build Astro website
        run: |
          npm run build

      - name: Verify generated site
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "dist/index.html"
            "dist/installation/index.html"
            "dist/robots.txt"
            "dist/sitemap-index.xml"
            "dist/sitemap-0.xml"
            "dist/favicon.svg"
            "dist/flowcast-mark.svg"
            "dist/og-flowcast.svg"
            "dist/screenshots/Capture1.png"
            "dist/screenshots/Capture3.png"
            "dist/screenshots/Capture7.png"
          )

          for file in "${required_files[@]}"; do
            [[ -f "$file" ]] || {
              echo "::error::Generated website file is missing: $file"
              exit 1
            }
          done

          echo "Generated website files are present."

      - name: Verify robots and sitemap
        shell: bash
        run: |
          set -euo pipefail

          site_url="https://chourmovs.github.io/JuggleCast-Community"
          sitemap_url="$site_url/sitemap-index.xml"

          grep \
            --quiet \
            --fixed-strings \
            "User-agent: *" \
            dist/robots.txt || {
              echo "::error::robots.txt does not contain the default user-agent rule"
              exit 1
            }

          grep \
            --quiet \
            --fixed-strings \
            "Allow: /" \
            dist/robots.txt || {
              echo "::error::robots.txt does not allow crawling"
              exit 1
            }

          grep \
            --quiet \
            --fixed-strings \
            "Sitemap: $sitemap_url" \
            dist/robots.txt || {
              echo "::error::robots.txt does not reference the expected sitemap"
              exit 1
            }

          grep \
            --quiet \
            --fixed-strings \
            "$site_url/sitemap-0.xml" \
            dist/sitemap-index.xml || {
              echo "::error::sitemap-index.xml does not reference sitemap-0.xml"
              exit 1
            }

          grep \
            --quiet \
            --fixed-strings \
            "$site_url/" \
            dist/sitemap-0.xml || {
              echo "::error::sitemap-0.xml does not contain the JuggleCast homepage"
              exit 1
            }

          grep \
            --quiet \
            --fixed-strings \
            "$site_url/installation" \
            dist/sitemap-0.xml || {
              echo "::error::sitemap-0.xml does not contain the installation page"
              exit 1
            }

          if grep \
            --recursive \
            --line-number \
            --fixed-strings \
            "flowcast.spotycast.ovh" \
            dist
          then
            echo "::error::Generated website still references the retired FlowCast domain"
            exit 1
          fi

          echo "Robots and sitemap validation passed."

      - name: Verify page SEO metadata
        shell: bash
        run: |
          set -euo pipefail

          pages=(
            "dist/index.html"
            "dist/installation/index.html"
          )

          for page in "${pages[@]}"; do
            grep \
              --quiet \
              --fixed-strings \
              'rel="canonical"' \
              "$page" || {
                echo "::error::$page has no canonical link"
                exit 1
              }

            grep \
              --quiet \
              --fixed-strings \
              'name="robots"' \
              "$page" || {
                echo "::error::$page has no robots meta tag"
                exit 1
              }

            grep \
              --quiet \
              --fixed-strings \
              'rel="sitemap"' \
              "$page" || {
                echo "::error::$page has no sitemap discovery link"
                exit 1
              }

            grep \
              --quiet \
              --fixed-strings \
              '/JuggleCast-Community/sitemap-index.xml' \
              "$page" || {
                echo "::error::$page references an invalid sitemap path"
                exit 1
              }
          done

          echo "Page SEO metadata validation passed."

      - name: Verify GitHub Pages asset paths
        shell: bash
        run: |
          set -euo pipefail

          invalid_patterns=(
            '/JuggleCast-Communityflowcast'
            '/JuggleCast-Communityscreenshots'
            'src="/screenshots/'
            'href="/favicon'
            'src="/flowcast-mark'
            'content="/og-flowcast'
          )

          for pattern in "${invalid_patterns[@]}"; do
            if grep \
              --recursive \
              --line-number \
              --fixed-strings \
              "$pattern" \
              dist
            then
              echo "::error::Invalid GitHub Pages asset path found: $pattern"
              exit 1
            fi
          done

          echo "GitHub Pages asset paths passed."

      - name: Verify rendered release version
        shell: bash
        run: |
          set -euo pipefail

          version="$(
            sed -n \
              's/^FLOWCAST_VERSION=//p' \
              ../version.env
          )"

          [[ -n "$version" ]] || {
            echo "::error::FLOWCAST_VERSION is missing from version.env"
            exit 1
          }

          grep \
            --recursive \
            --quiet \
            --fixed-strings \
            "$version" \
            dist || {
              echo "::error::Generated website does not contain JuggleCast version $version"
              exit 1
            }

          grep \
            --recursive \
            --quiet \
            --fixed-strings \
            "v$version/install.sh" \
            dist || {
              echo "::error::Generated website does not contain the tagged installer URL"
              exit 1
            }

          echo "Rendered release version passed: $version"
