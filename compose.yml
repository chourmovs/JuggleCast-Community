name: flowcast

x-common: &common
  restart: unless-stopped
  networks: [flowcast-internal]

services:
  storage-init:
    image: ghcr.io/chourmovs/jugglecast-engine:${FLOWCAST_VERSION:?FLOWCAST_VERSION is required}
    user: "0:0"
    entrypoint: []
    command:
      - /bin/sh
      - -c
      - >-
        mkdir -p /flowcast/config /data/engine_history /data/cache/preprocess
        /data/analysis /data/runtime-state /data/flowcast-backups &&
        chown -R 10001:10001 /flowcast /data/engine_history /data/cache
        /data/analysis /data/flowcast-backups &&
        chmod 1777 /data/runtime-state
    restart: "no"
    volumes:
      - flowcast-settings:/flowcast
      - flowcast-engine-history:/data/engine_history
      - flowcast-cache:/data/cache
      - flowcast-analysis:/data/analysis
      - flowcast-runtime-state:/data/runtime-state
      - flowcast-backups:/data/flowcast-backups

  control:
    <<: *common
    image: ghcr.io/chourmovs/jugglecast-control:${FLOWCAST_VERSION:?FLOWCAST_VERSION is required}
    environment:
      ENGINE_CONTAINER: engine
      COMPOSE_SERVICE_ENGINE: engine
      BLISS_CONTAINER: bliss
      FLOWCAST_AUTH_ENABLED: ${FLOWCAST_AUTH_ENABLED:-true}
      FLOWCAST_DOCKER_CONTROL_ENABLED: ${FLOWCAST_DOCKER_CONTROL_ENABLED:-true}
      FLOWCAST_PUBLIC_URL: ${FLOWCAST_PUBLIC_URL:-}
      FLOWCAST_STATISTICS_SESSION_RETENTION_DAYS: ${FLOWCAST_STATISTICS_SESSION_RETENTION_DAYS:-365}
      FLOWCAST_STATISTICS_SAMPLE_RETENTION_DAYS: ${FLOWCAST_STATISTICS_SAMPLE_RETENTION_DAYS:-90}
      ICECAST_SCHEME: http
      ICECAST_HOST: icecast
      ICECAST_PORT: 8000
      ICECAST_STATUS_PATH: /status-json.xsl
    ports:
      - "${FLOWCAST_HTTP_PORT:-8080}:8088"
    volumes:
      - flowcast-catalog:/data/flowcast
      - flowcast-backups:/data/flowcast-backups
      - flowcast-media:/data/flowcast-media
      - flowcast-settings:/flowcast
      - flowcast-engine-history:/data/engine_history
      - flowcast-runtime-state:/runtime-state:ro
      - icecast-logs:/data/icecast:ro
    depends_on:
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
              'http://127.0.0.1:8088/api/health',
              timeout=2
          ).read()
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  engine:
    <<: *common
    image: ghcr.io/chourmovs/jugglecast-engine:${FLOWCAST_VERSION:?FLOWCAST_VERSION is required}
    command:
      - /usr/local/bin/flowcast-engine-entrypoint.sh
    environment:
      ICECAST_PASSWORD: ${ICECAST_SOURCE_PASSWORD:?ICECAST_SOURCE_PASSWORD is required}
      SCHED_CONFIG: /flowcast/config/config.yml
    volumes:
      - flowcast-settings:/flowcast:ro
      - flowcast-catalog:/data/flowcast:ro
      - flowcast-engine-history:/data/engine_history
      - flowcast-cache:/data/cache
      - flowcast-analysis:/data/analysis
      - flowcast-runtime-state:/tmp
      - flowcast-media:/data/flowcast-media:ro
    depends_on:
      storage-init:
        condition: service_completed_successfully
      control:
        condition: service_healthy
      icecast:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/flowcast-engine
        - --healthcheck
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 120s

  audio-daemon:
    <<: *common
    image: ghcr.io/chourmovs/jugglecast-analyzer:${FLOWCAST_VERSION:?FLOWCAST_VERSION is required}
    command:
      - /usr/local/bin/flowcast-analyzer-entrypoint.sh
    environment:
      SCHED_CONFIG: /flowcast/config/config.yml
    volumes:
      - flowcast-settings:/flowcast:ro
      - flowcast-analysis:/data/analysis
      - flowcast-media:/data/flowcast-media:ro
    depends_on:
      storage-init:
        condition: service_completed_successfully
      control:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/flowcast-analyzer
        - --healthcheck
      interval: 30s
      timeout: 5s
      retries: 12
      start_period: 180s

  bliss:
    <<: *common
    image: ghcr.io/chourmovs/jugglecast-bliss:${FLOWCAST_VERSION:?FLOWCAST_VERSION is required}
    command:
      - /usr/local/bin/flowcast-bliss-entrypoint.sh
    volumes:
      - flowcast-media:/data/flowcast-media:ro
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8090/health]
      interval: 10s
      timeout: 5s
      retries: 20

  icecast:
    <<: *common
    image: ghcr.io/chourmovs/jugglecast-icecast:${FLOWCAST_VERSION:?FLOWCAST_VERSION is required}
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:?ICECAST_SOURCE_PASSWORD is required}
      ICECAST_RELAY_PASSWORD: ${ICECAST_RELAY_PASSWORD:?ICECAST_RELAY_PASSWORD is required}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD:?ICECAST_ADMIN_PASSWORD is required}
    ports:
      - "${FLOWCAST_STREAM_PORT:-8010}:8000"
    volumes:
      - icecast-logs:/data/icecast
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8000/status-json.xsl]
      interval: 10s
      timeout: 5s
      retries: 20

networks:
  flowcast-internal:

volumes:
  flowcast-backups:
  flowcast-catalog:
  flowcast-media:
  flowcast-settings:
  flowcast-engine-history:
  flowcast-cache:
  flowcast-analysis:
  flowcast-runtime-state:
  icecast-logs:
